name: Update Trans 7 stream URL

on:
  schedule:
    - cron: '*/15 * * * *'   # tiap 15 menit (jadwal GitHub bisa meleset beberapa menit)
  workflow_dispatch:          # tombol Run workflow manual di tab Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Sniff & update URL Trans 7
        run: python scripts/update_trans7.py

      - name: Upload debug artifact (kalau gagal)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-sevenhub
          path: debug/
          retention-days: 7

      - name: Commit & push jika ada perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add streams/trans7.m3u8
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan, skip commit & push."
          else
            git commit -m "auto: update Trans 7 stream manifest"
            git push
          fi
