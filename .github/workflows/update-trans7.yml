name: Update Trans 7 stream URL

on:
  schedule:
    - cron: '*/30 * * * *'   # tiap 30 menit (jadwal GitHub bisa meleset beberapa menit)
  workflow_dispatch:          # tombol Run workflow manual di tab Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Sniff & update URL Trans 7
        run: python scripts/update_trans7.py

      - name: Commit & push jika ada perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add xetyasmarttv.m3u
          git diff --cached --quiet || git commit -m "auto: update Trans 7 stream url"
          git diff --cached --quiet || git push
